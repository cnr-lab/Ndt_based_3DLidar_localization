# robot_localization_ekf.yaml - 매우 보수적인 설정
/**:
    ros__parameters:
      # General Settings
      use_sim_time: true
      frequency: 5.0   # 더 낮은 주파수로 안정화
      sensor_timeout: 0.2  # 더 긴 타임아웃 
      two_d_mode: true
      transform_time_offset: 0.0
      transform_timeout: 0.0
      print_diagnostics: true
      debug: true  # 디버그 활성화
      permit_corrected_publication: false
      publish_acceleration: false
      publish_tf: true
      map_frame: map
      odom_frame: odom
      base_link_frame: base_footprint
      world_frame: odom  

      odom0: /odom
      odom0_config: [true,  true,  false,  # x, y만 사용
                    false, false, false,   # orientation은 IMU만
                    true,  true,  false,   # velocity만 사용
                    false, false, false,   # angular velocity는 IMU만
                    false, false, false]   # acceleration 사용 안함
      odom0_queue_size: 3 
      odom0_nodelay: true
      odom0_differential: false
      odom0_relative: false

      imu0: /imu
      imu0_config: [false, false, false,   # position 사용 안함
                    false, false, true,    # yaw만 사용 (roll, pitch는 불안정)
                    false, false, false,   # velocity 사용 안함
                    false, false, false,   # angular velocity 사용 안함 (너무 불안정)
                    false, false, false]   # acceleration 사용 안함 (너무 불안정)
      imu0_queue_size: 10  
      imu0_nodelay: true
      imu0_differential: false
      imu0_relative: false
      imu0_remove_gravitational_acceleration: true
      
